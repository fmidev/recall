version: '3.8'
services:
  db:
    image: "docker.io/postgis/postgis:16-3.4"
    environment:
      POSTGRES_MULTIPLE_DATABASES: recalldb
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/create-multiple-postgresql-databases.sh:/docker-entrypoint-initdb.d/multibase.sh:Z
    ports:
      - "5432:5432"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d recalldb"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: "docker.io/library/redis:alpine"
    ports:
      - "6379:6379"
    restart: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
  terracotta:
    build: ./terracotta
    image: terracotta:latest
    environment:
      PYTHONUNBUFFERED: 1
      TC_DRIVER_PATH: postgresql://postgres:postgres@db:5432/terracotta
      TC_RASTER_CACHE_SIZE: 1027604480
      TC_PORT: 8088
      TC_DEFAULT_TILE_SIZE: [512, 512]
      TC_EXTRA_CMAP_FOLDER: /tmp/recall/colormaps
      AWS_NO_SIGN_REQUEST: YES
    volumes:
      - /tmp/recall:/tmp/recall:z
    ports:
      - "8088:8088"
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: recall:latest
    command: celery -A recall.app.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}
    environment:
      PYTHONUNBUFFERED: 1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PREVENT_DB_URI: postgresql://postgres:postgres@db:5432/recalldb
      TC_DB_URI: postgresql://postgres:postgres@db:5432/terracotta
      TC_EXTRA_CMAP_FOLDER: /tmp/recall/colormaps
    volumes:
      - /tmp/recall:/tmp/recall:z
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      terracotta:
        condition: service_started
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: recall:latest
    ports:
      - "8050:8050"
    environment:
      PYTHONUNBUFFERED: 1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PREVENT_DB_URI: postgresql://postgres:postgres@db:5432/recalldb
      TC_DB_URI: postgresql://postgres:postgres@db:5432/terracotta
      TC_URL: http://localhost:8088
      FMI_COMMERCIAL_API_KEY: ${FMI_COMMERCIAL_API_KEY:-}
      TC_EXTRA_CMAP_FOLDER: /tmp/recall/colormaps
    volumes:
      - /tmp/recall:/tmp/recall:z
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
      terracotta:
        condition: service_started
volumes:
  db_data:
