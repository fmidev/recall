[build-system]
requires = ["hatchling==1.27.0", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[project]
name = "recall"
dynamic = ["version"]
description = 'Radar Event Catalog and Archive Lookup Library'
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = []
authors = [
  { name = "Jussi Tiira", email = "jussi.tiira@fmi.fi" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "dash-leaflet",
  "gunicorn",
  "celery[redis]",
  "terracotta",
  "rasterio",
  "boto3",
  "dash",
  "flask_sqlalchemy",
  "flask_migrate",
  "geoalchemy2",
  "psycopg2-binary",
  "dash-bootstrap-components",
  "matplotlib",
  "tomli-w",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]
dev = [
  "ruff>=0.11",
]

[dependency-groups]
# Export this group for the tile server's separate Docker build context.
tile = [
  "terracotta",
  "psycopg2-binary",
  "gunicorn",
  "matplotlib",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Dash's All-in-One component IDs convention uses class-level lambdas.
"src/recall/aios.py" = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a disposable PostGIS database",
]

[project.scripts]
recall = "recall.app:main"

[project.urls]
#Documentation = "https://github.com/Jussi Tiira/recall#readme"
#Issues = "https://github.com/Jussi Tiira/recall/issues"
#Source = "https://github.com/Jussi Tiira/recall"

[tool.hatch.version]
source = "vcs"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]

[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/recall tests}"

[tool.hatch.build]
exclude = [
  "**/secrets.py",
  "**/.env",
  "**/.env.*",
]

[tool.hatch.build.targets.sdist]
only-include = [
  "src/recall",
  "tests",
  "migrations",
  "README.md",
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
]

[tool.coverage.run]
source_pkgs = ["recall", "tests"]
branch = true
parallel = true
omit = [
]

[tool.coverage.paths]
recall = ["src/recall", "*/recall/src/recall"]
tests = ["tests", "*/recall/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
